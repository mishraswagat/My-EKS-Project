apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wildfly
  template:
    metadata:
      labels:
        app: wildfly
    spec:
      containers:
      - name: wildfly
        image: quay.io/wildfly/wildfly:26.1.2.Final
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wildfly-nodeport
spec:
  type: NodePort
  selector:
    app: wildfly
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30008

